name: Reporte Regulatorio Diario

on:
  schedule:
    # GitHub Actions aplica una demora de cola de ~7 horas en el evento 'schedule' de este repositorio.
    # Programado a las 03:30 UTC para que, tras la cola de GitHub (~7h), se ejecute entre las 10:30 y 11:00 UTC (07:30 - 08:00 AM Argentina).
    - cron: '30 03 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Argentina/Buenos_Aires

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Reporte Regulatorio
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python src/main.py
